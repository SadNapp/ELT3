<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock ELT Dashboard | Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <nav class="navbar navbar-dark mb-4 shadow">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📊 Extract Load Transform</span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-lg-4 col-md-5 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body p-0 d-flex flex-column">
                        <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-dark text-white rounded-top">
                            <h5 class="m-0">Market Summary</h5>
                            <button class="btn btn-sm btn-outline-light" onclick="fetchStocks()">Refresh</button>
                        </div>

                        <div class="p-3 bg-dark-soft border-bottom">
                            <input type="text" id="searchInput" list="stock-suggestions"
                                   class="form-control bg-dark text-white border-secondary"
                                   placeholder="Search ticker or company name..."
                                   oninput="handleSearchInput()">

                            <datalist id="stock-suggestions"></datalist>

                            <div id="global-search-container"></div>
                        </div>

                        <div class="table-container">
                            <table class="table table-hover mb-0">
                                <thead class="table-dark-header">
                                    <tr>
                                        <th>Ticker</th>
                                        <th>Price</th>
                                        <th>Change</th>
                                    </tr>
                                </thead>
                                <tbody id="stocks-body">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8 col-md-7 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title m-0" id="chart-title">Price History: AAPL</h5>
                            <span class="badge bg-primary">Live Data</span>
                        </div>
                        <div class="chart-wrapper">
                            <canvas id="stockChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
